name: Backend and PostgreSQL migrations

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-migrations.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-migrations.yml"

permissions:
  contents: read

jobs:
  migration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: migration_test_only
          POSTGRES_DB: migration_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      MIGRATION_TEST_ADMIN_URL: postgresql+psycopg://postgres:migration_test_only@127.0.0.1:5432/migration_audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.production.txt
      - run: python -m pip install -r backend/requirements.production.txt
      - run: python -m unittest discover -s backend/tests -v
