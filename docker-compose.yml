services:
  postgres:
    image: postgres:16-alpine
    container_name: ws3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ws3}
      POSTGRES_USER: ${POSTGRES_USER:-ws3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ws3_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ws3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ws3_postgres_data:
