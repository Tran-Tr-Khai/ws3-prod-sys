[project]
name = "ws3-backend"
version = "0.1.0"
description = "WS3 internal production system backend"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "psycopg[binary]==3.2.3",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
    "alembic==1.14.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
]

[tool.uv]
package = false
